# Install once:  pip install pre-commit   (or: uv tool install pre-commit)
# Then:          pre-commit install        (runs on every commit)
# Refresh pins:  pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.33.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # Compiler warnings as errors + formatting checks. C# has no bandit equivalent that runs
      # offline here; CodeQL in CI (.github/workflows/codeql.yml) is the code security scanner.
      - id: vaultkeep-lint
        name: VaultKeep lint (warnings as errors, formatting)
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File lint.ps1
        language: system
        pass_filenames: false
        files: \.(cs|ps1|md|ya?ml|json)$
