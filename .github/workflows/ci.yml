name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Lint, build, test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        shell: powershell
        run: .\lint.ps1

      - name: Build
        shell: powershell
        run: .\build.ps1

      # Session tests need an interactive desktop (Notepad / File Explorer), so CI runs the headless set.
      - name: Test
        shell: powershell
        run: .\test.ps1 -Headless
